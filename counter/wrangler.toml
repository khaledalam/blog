name = "blog-views"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# KV namespace holding per-post view counts.
# The `id` below is filled in by `wrangler kv namespace create VIEWS`
# (see counter/README.md). The placeholder lets the file be committed.
[[kv_namespaces]]
binding = "VIEWS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
